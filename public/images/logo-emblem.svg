<svg xmlns="http://www.w3.org/2000/svg" viewBox="205 62 190 206" role="img" aria-label="Creative Dynasty Events emblem">
<defs>
                        <!-- Primary Linear Gold Gradient -->
                        <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#7A5412"></stop>
                            <stop offset="25%" stop-color="#D4AF37"></stop>
                            <stop offset="50%" stop-color="#FFF2B2"></stop>
                            <stop offset="75%" stop-color="#AA771C"></stop>
                            <stop offset="100%" stop-color="#F5D77F"></stop>
                        </linearGradient>

                        <!-- Secondary Reverse Gold Gradient for dynamic contrast -->
                        <linearGradient id="goldGradRev" x1="100%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#F5D77F"></stop>
                            <stop offset="30%" stop-color="#AA771C"></stop>
                            <stop offset="60%" stop-color="#FFF2B2"></stop>
                            <stop offset="85%" stop-color="#D4AF37"></stop>
                            <stop offset="100%" stop-color="#7A5412"></stop>
                        </linearGradient>

                        <!-- Radial Accent Gradient -->
                        <radialGradient id="goldRadial" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#FFF2B2"></stop>
                            <stop offset="70%" stop-color="#D4AF37"></stop>
                            <stop offset="100%" stop-color="#AA771C"></stop>
                        </radialGradient>
                    </defs>
                        <g transform="translate(300, 165)">
                            <!-- Outer Compass Ring Dial with Degree ticks -->
                            <circle cx="0" cy="0" r="62" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.9"></circle>
                            <circle cx="0" cy="0" r="56" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="2, 4" opacity="0.7"></circle>

                            <!-- Compass Rose Major Points -->
                            <!-- North Point -->
                            <polygon points="0,0 -12,-15 0,-85" fill="url(#goldGrad)"></polygon>
                            <polygon points="0,0 12,-15 0,-85" fill="url(#goldGradRev)" opacity="0.85"></polygon>
                            <!-- South Point -->
                            <polygon points="0,0 -12,15 0,85" fill="url(#goldGradRev)"></polygon>
                            <polygon points="0,0 12,15 0,85" fill="url(#goldGrad)" opacity="0.85"></polygon>
                            <!-- East Point -->
                            <polygon points="0,0 15,-12 85,0" fill="url(#goldGrad)"></polygon>
                            <polygon points="0,0 15,12 85,0" fill="url(#goldGradRev)" opacity="0.85"></polygon>
                            <!-- West Point -->
                            <polygon points="0,0 -15,-12 -85,0" fill="url(#goldGradRev)"></polygon>
                            <polygon points="0,0 -15,12 -85,0" fill="url(#goldGrad)" opacity="0.85"></polygon>

                            <!-- Compass Rose Minor Points (Diagonal Stars) -->
                            <!-- NE -->
                            <polygon points="0,0 2,-8 48,-48" fill="url(#goldGrad)"></polygon>
                            <polygon points="0,0 8,-2 48,-48" fill="url(#goldGradRev)"></polygon>
                            <!-- NW -->
                            <polygon points="0,0 -2,-8 -48,-48" fill="url(#goldGradRev)"></polygon>
                            <polygon points="0,0 -8,-2 -48,-48" fill="url(#goldGrad)"></polygon>
                            <!-- SE -->
                            <polygon points="0,0 2,8 48,48" fill="url(#goldGradRev)"></polygon>
                            <polygon points="0,0 8,2 48,48" fill="url(#goldGrad)"></polygon>
                            <!-- SW -->
                            <polygon points="0,0 -2,8 -48,48" fill="url(#goldGrad)"></polygon>
                            <polygon points="0,0 -8,2 -48,48" fill="url(#goldGradRev)"></polygon>

                            <!-- Center Ring Detail -->
                            <circle cx="0" cy="0" r="12" fill="url(#goldGrad)"></circle>
                            <circle cx="0" cy="0" r="7" fill="#020617"></circle>

                            <!-- Paintbrush Overlay Layered Diagonally (-45 deg) -->
                            <g transform="rotate(-45)">
                                <!-- Handle Shaft -->
                                <path d="M -4,-80 L 4,-80 L 3,25 L -3,25 Z" fill="url(#goldGrad)"></path>
                                <!-- Ferrule (Metal Ring) -->
                                <rect x="-5" y="25" width="10" height="18" rx="2" fill="url(#goldGradRev)"></rect>
                                <line x1="-5" y1="31" x2="5" y2="31" stroke="#000" stroke-width="0.8" opacity="0.4"></line>
                                <line x1="-5" y1="37" x2="5" y2="37" stroke="#000" stroke-width="0.8" opacity="0.4"></line>
                                <!-- Brush Tip / Bristles -->
                                <path d="M -5,43 C -5,55 -8,68 0,82 C 8,68 5,55 5,43 Z" fill="url(#goldGrad)"></path>
                                <!-- Brush Tip Highlight Detail -->
                                <path d="M -2,43 C -2,52 -4,62 0,73 C 2,62 2,52 2,43 Z" fill="url(#goldGradRev)" opacity="0.6"></path>
                            </g>

                            <!-- Laurel Leaf Branch Accent (Bottom Right of Compass) -->
                            <g transform="translate(35, 25) rotate(-15)">
                                <path d="M 0,35 Q 25,20 45,-10" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"></path>
                                <!-- Individual Leaves -->
                                <path d="M 10,28 Q 2,18 10,12 Q 18,18 10,28 Z" fill="url(#goldGrad)"></path>
                                <path d="M 20,20 Q 15,8 24,4 Q 30,12 20,20 Z" fill="url(#goldGrad)"></path>
                                <path d="M 30,11 Q 28,-2 37,-4 Q 40,8 30,11 Z" fill="url(#goldGrad)"></path>
                                <path d="M 40,1 Q 42,-12 49,-10 Q 48,3 40,1 Z" fill="url(#goldGrad)"></path>
                                <!-- Opposite Side Leaves -->
                                <path d="M 14,31 Q 22,25 26,34 Q 18,38 14,31 Z" fill="url(#goldGradRev)"></path>
                                <path d="M 25,22 Q 35,18 37,27 Q 29,30 25,22 Z" fill="url(#goldGradRev)"></path>
                                <path d="M 35,10 Q 45,10 45,18 Q 38,20 35,10 Z" fill="url(#goldGradRev)"></path>
                            </g>
                        </g>
</svg>
